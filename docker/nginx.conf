# Static only: GET and HEAD, nothing is written on the server.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1k;           # nothing is uploaded to the server
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-ancestors 'self'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location ~* \.(js|css|svg|png|ico)$ { expires 1h; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ /index.html; }
}
